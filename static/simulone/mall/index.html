// ── what happens: a line over the map, and kept under More

  if (e.quiet && kind !== 'chosen') return;

  else if (kind === 'started' && (e.mods || e.loud)) note(`<b>${e.title}</b>: ${e.text}`, true);
  else if (kind === 'ended' && (e.mods || e.loud)) note(`${e.title}: over`, true);

// ── stages, goals, achievements

// ── the camera looks at one floor
function showFloor(k, centre) {

  k = floors.show(k, r, 110);

function showFloorButtons() {

// ── time: pause, and a speed that cycles

const pauseBtn = ui.control('pause', () => { if (pausedAt === null) { pausedAt = game.speed; game.speed = 0; } else { game.speed = pausedAt; pausedAt = null; } showSpeed(); });
const speedBtn = ui.control('1×', () => { const now = pausedAt ?? game.speed, next = SPEEDS[(SPEEDS.indexOf(now) + 1) % SPEEDS.length]; if (pausedAt !== null) pausedAt = next; else game.speed = next; showSpeed(); });
function showSpeed() { pauseBtn.textContent = pausedAt === null ? 'pause' : 'go on'; pauseBtn.className = pausedAt === null ? '' : 'on'; speedBtn.textContent = (pausedAt ?? game.speed) + '×'; }

function visitorsSheet(body) {
  const kinds = Object.entries(visitors.byKind()).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span>${pic('person:' + k, '')}${n} ${plural(k, n)}</span>`).join(''), t = visitors.tally;
  const wants = {};
  for (let i = 0; i < sim.count; i++) if (visitors.is(i)) for (const w of visitors.info(i).wishes) if (w.state === 'wanted') wants[w.need] = (wants[w.need] ?? 0) + 1;
  const wanted = Object.entries(wants).sort((a, b) => b[1] - a[1]).map(([n, k]) => `${k} ${wordsOf[n]}`).join(', ');
  const rows = visitors.recent.slice(0, 16).map(r => `<li>${stars(r.score)} ${r.kind}, ${LEFT[r.reason] ?? r.reason}, spent ${money(r.spent)}` +
    (r.missed.length ? ` <small>missed ${r.missed.map(m => `${wordsOf[m[0]]} (${WHY[m[1]] ?? m[1]})`).join(', ')}</small>` : '') + `</li>`);
  ui.html(body, (kinds ? `<div class="who">${kinds}</div>` : '') + `<p>${ico('people')} ${visitors.count} inside. Today ${t.arrived} came and ${t.gone} have left${t.gone ? ', rating the visit ' + stars(t.scoreSum / t.gone) : ''}.</p>` +
    (wanted ? `<p><span class="k-dim">Looking for:</span> ${wanted}</p>` : '') +
    `<p class="k-dim">${rules.phase === 'open' ? `About ${Math.round(rules.expected())} are expected today as things stand.` : 'The doors are shut.'} The mall is rated ${stars(reputation.rating)}, which brings ${Math.round(reputation.factor() * 100)}% of the visitors a mall of its standing would have; its ${rules.varietyCount()} kind${rules.varietyCount() === 1 ? '' : 's'} of unit bring ${Math.round(rules.varietyFactor() * 100)}%.</p>` +
    `<h3>Who left, and why</h3><ul>${rows.join('') || '<li class="k-dim">nobody yet</li>'}</ul>`);
  body.onclick = null;
}
function moneySheet(body) {
  const takings = trade.takings(), d = rules.due(), L = rules.loan;
  ui.html(body, `<p><span class="bank">${ico('money')}${Math.round(economy.town.money).toLocaleString('en')}</span> <span class="k-dim">in the bank</span></p>` +
    `<p>Today so far: takings ${money(takings)}.<br>Due at closing: goods sold ${money(d.goods)}, wages ${money(d.wages)}, upkeep ${money(d.upkeep)}${d.loan ? ', the bank ' + money(d.loan) : ''}${d.owed ? `, <b class="warn">owed from before ${money(d.owed)}</b>` : ''}: ${money(d.total)} in all.</p>` +
    (L.taken ? `<p class="k-dim">${L.left ? `The bank's loan: ${L.left} more day${L.left === 1 ? '' : 's'} of ${money(M.LOAN.daily)}.` : 'The bank\'s loan is repaid.'}</p>` : '') +
    (rules.history.length ? `<h3>The last days</h3><div class="k-scroll"><table><tr><th>day</th><th>visitors</th><th>rating</th><th>takings</th><th>profit</th></tr>` +
      rules.history.map(d => `<tr><td>${d.day} ${d.weekday}</td><td>${d.arrived}</td><td>${stars(d.rating)}</td><td>${money(d.takings)}</td><td>${signed(d.profit)}</td></tr>`).join('') + `</table></div>` : '<p class="k-dim">The first day is still running.</p>'));
  body.onclick = null;
}
function goalsSheet(body) {
  const L = progress.levelInfo(), g = progress.goal();
  const val = p => (p.label.includes('profit') ? money(Math.min(p.target, Math.max(0, p.value))) + ' / ' + money(p.target) : Math.min(p.target, Math.floor(p.value)) + ' / ' + p.target);
  const part = p => `<li>${p.done ? '■' : '□'} ${p.label} <span class="k-dim">${p.flag ? '' : val(p)}</span></li>`;
  ui.html(body, (g ? `<p><b>goal ${g.n} of ${g.of}</b> ${g.title}${meter(g.progress.ratio)}</p><p>${cap(g.text)}${rewardText(g.reward)}.</p>` : '<p>Every goal is met.</p>') +
    `<h3>${cap(M.STAGE_NAMES[progress.level])}${L.next ? ', to become ' + (/^[aeiou]/.test(L.next.title) ? 'an ' : 'a ') + L.next.title : ''}</h3>` + (L.next ? `<ul>${L.next.progress.parts.map(part).join('')}</ul>` : '<p class="k-dim">There is no higher standing.</p>') +
    `<p style="margin-top:6px">The mall is rated ${stars(reputation.rating)}. Each day it moves a third of the way to what that day's visitors thought.</p>` +
    `<h3>Achievements</h3><ul>${progress.achievements().map(a => `<li${a.done ? '' : ' class="k-dim"'}>${a.done ? '■' : '□'} ${a.title}</li>`).join('')}</ul>`);
  body.onclick = null;
}
function policySheet(body) {
  const words = id => (id === 'open' || id === 'close' ? ['earlier', 'later'] : id === 'wages' ? ['lower', 'higher'] : ['cheaper', 'dearer']);
  const rows = policies.list().map(p => `<p><b>${p.title}</b> ${p.words}<br><span class="k-dim">${cap(p.text)}.</span><br>` +
    `<button data-id="${p.id}" data-by="-1"${p.value <= p.min ? ' disabled' : ''}>${words(p.id)[0]}</button> <button data-id="${p.id}" data-by="1"${p.value >= p.max ? ' disabled' : ''}>${words(p.id)[1]}</button></p>`).join('');
  ui.html(body, rows + `<p class="k-dim">New hours hold from the next change of the day: opening hours from tomorrow morning, closing from today.</p>`);
  body.onclick = e => { const b = e.target.closest('button'); if (!b) return; policies.nudge(b.dataset.id, +b.dataset.by); policySheet(body); save(); };
}
let sure = -1e9;
function moreSheet(body) {
  const g = game, again = performance.now() - sure < 4000, r = rules.lastReport;
  ui.html(body, (r ? `<h3>Day ${r.day}, ${DAYS[r.weekday]}</h3>${reportHtml(r)}` : '<p class="k-dim">The first day is still running: its report comes at closing.</p>') +
    `<h3>What happened</h3><ul>${log.slice(0, 12).map(([t, e]) => `<li><span class="k-dim">${t}</span> ${e}</li>`).join('') || '<li class="k-dim">nothing out of the ordinary yet</li>'}</ul>` +
    `<h3>This mall</h3><p>${cap(lastSave || (resumed ? 'picked up from the save on this device' : 'a new mall; it is saved every hour of its day'))}.</p><div class="k-chips"><button data-do="saves">saved games</button><button data-do="new">${again ? 'tap again to give up this mall' : 'new mall'}</button></div>` +
    `<h3>How it runs on this device</h3><p class="k-dim">${Math.round(g.stats.fps)} frames a second · simulation ${g.stats.simMs.toFixed(2)} ms and drawing ${g.stats.renderMs.toFixed(2)} ms a frame · ${sim.count} people · map shown at ${ui.canvas.width} × ${ui.canvas.height}</p>`);
  body.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.do === 'saves') { hold(slots.panel()); slots.wire(); return; }
    if (performance.now() - sure < 4000) { sure = -1e9; ui.close(); loader.run('a new mall', () => { start(true); welcome(); }); return; }
    sure = performance.now(); moreSheet(body);
  };
}
ui.bar([
  { id: 'build', label: ico('build') + '<span>Build</span>', title: 'Build', render: buildSheet,
    onOpen: () => { game.beginBuild(); sel = null; ui.card(null); buildSay = ''; toolChoice = null; applyTool(); },
    onClose: () => { game.withdraw(); game.tool = null; toolChoice = null; game.endBuild(); save(); } },
  { id: 'units', label: ico('units') + '<span>Units</span>', title: 'Units today', render: unitsSheet },
  { id: 'visitors', label: ico('people') + '<span>People</span>', title: 'Visitors', render: visitorsSheet },
  { id: 'money', label: ico('money') + '<span>Money</span>', title: 'Money', render: moneySheet },
  { id: 'policy', label: ico('policy') + '<span>Policy</span>', title: 'Policy', render: policySheet },
  { id: 'goals', label: ico('goals') + '<span>Goals</span>', title: 'Goals', render: goalsSheet },
  { id: 'more', label: ico('more') + '<span>More</span>', title: 'Report and more', render: moreSheet },
]);

// ── over the map: litter on the floor, and a mark on a unit that is shut. The engine draws tiles, units and people;
// this is the page's own layer on top (it takes no touches).
const over = ui.layer(), og = over.getContext('2d');
function drawOver() {
  const c = ui.canvas, r = game.renderer, cam = game.camera;
  if (over.width !== c.width || over.height !== c.height) { over.width = c.width; over.height = c.height; }
  og.clearRect(0, 0, over.width, over.height);
  const sx = (x, y) => ((x - y) * r.hw + r.originX - cam.x) * cam.zoom + c.width / 2, sy = (x, y) => ((x + y) * r.hh - cam.y) * cam.zoom + c.height / 2;
  const z = cam.zoom, rect = M.floorRect(floors.shown);
  og.fillStyle = '#4a4034';
  for (const [x, y] of upkeep.cells(rect)) for (let k = 0; k < 3; k++) {       // three specks a dirty cell, always in the same places
    const n = Math.imul(x * 31 + y * 17 + k * 7, 0x9e3779b1) >>> 0, fx = 0.25 + (n % 1000) / 2000, fy = 0.25 + ((n >>> 10) % 1000) / 2000;
    og.fillRect(Math.round(sx(x + fx, y + fy)), Math.round(sy(x + fx, y + fy)), Math.max(1, Math.round(z)), Math.max(1, Math.round(z)));
  }
  const warn = getComputedStyle(document.documentElement).getPropertyValue('--k-warn').trim() || '#a8321c';
  og.font = `bold ${Math.round(9 * z)}px sans-serif`; og.textAlign = 'center'; og.textBaseline = 'middle';
  for (const b of world.buildings) {
    if (!b || !b.blocked || floors.of(b.x, b.y) !== floors.shown || rules.phase === 'closed') continue;
    const x = sx(b.x, b.y), y = sy(b.x, b.y) - (WALL_HEIGHT + 8) * z;                    // over the corner where the two walls meet
    og.fillStyle = warn; og.beginPath(); og.arc(x, y, 5.5 * z, 0, 6.2832); og.fill();
    og.fillStyle = '#fff'; og.fillText(b.broken ? '!' : '×', x, y + 0.5 * z);
  }
}

// ── every frame, and a few times a second
let frames = 0;
let lastFrame = performance.now();
function updateUI(g) {
  // What moves inside the rooms goes by real time, whatever the game's speed, and stands still while the game does.
  const nowMs = performance.now();
  if (g.speed > 0 && !g.buildMode) artClock.ms += Math.min(100, nowMs - lastFrame);
  lastFrame = nowMs; g.renderer.clockMs = artClock.ms;
  drawOver();
  if (ui.open !== 'build') {                                    // a marker under whoever, or whatever, is picked
    const i = sel?.vid !== undefined ? visitors.slotOf(sel.vid) : -1, b = sel?.bid !== undefined ? world.buildings[sel.bid] : null;
    const here = (x, y) => floors.of(x, y) === floors.shown;      // nothing is marked on a floor that is not on screen
    g.preview = i >= 0 && sim.inside[i] < 0 && here(sim.px[i] | 0, sim.py[i] | 0) ? [[Math.floor(sim.px[i]), Math.floor(sim.py[i])]] : b && here(b.ex, b.ey) ? [[b.ex, b.ey]] : [];
  }
  if (frames++ % 12) return;
  const t = visitors.tally, D = rules.hours(), phase = rules.phase;
  ui.when(`<b>${rules.weekday().name}</b> day ${rules.day} · ${ico('clock')} ${calendar.clock()}`);
  ui.numbers([
    { label: ico('money'), value: Math.round(economy.town.money).toLocaleString('en'), warn: rules.owed > 0 || economy.town.money < rules.due().total },
    { label: ico('star'), value: reputation.rating.toFixed(1) + (t.gone ? ` <small>today ${(t.scoreSum / t.gone).toFixed(1)}</small>` : '') },
    { label: ico('people'), value: visitors.count },
    { label: ico('till'), value: Math.round(trade.takings()).toLocaleString('en') + ' <small>today</small>' },
  ]);
  askLoan();
  showFloorButtons();
  const omens = happenings.current().filter(c => c.status !== 'asking' && !(c.event.quiet && c.status === 'announced'));
  ui.sub(omens.length ? omens.map(c => `<b>${c.event.title}</b> ${c.status === 'announced' ? 'in ' + span(c.startsIn) : c.endsIn > M.DAY ? 'for ' + Math.ceil(c.endsIn / M.DAY) + ' more days' : 'today'}`).join(' · ')
    : phase === 'prep' ? `the doors open at ${clockOf(D.open)}: staff are coming in` : phase === 'open' ? `open until ${clockOf(D.close)} · about ${Math.round(rules.expected())} visitors expected today`
    : phase === 'closing' ? `closing: ${visitors.count} still inside` : 'closed for the night');
  const goal = progress.goal();
  ui.goal(goal ? `${ico('goals')} <span class="k-dim">${goal.n}/${goal.of}</span> ${goal.title}${meter(goal.progress.ratio)}` : '<span class="k-dim">every goal is met</span>', () => ui.show('goals'));
  ui.hint(goal && goal.n <= 2 && !ui.fullOpen ? 'build' : null);
  showCard();
  ui.refresh();
}
loader.run('opening the doors', () => {
  if (!start()) welcome();
  if (unreadable) ui.toast('the mall saved here was made by an older version of the game and could not be opened', 8000);
});
</script>
