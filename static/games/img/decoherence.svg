<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" shape-rendering="crispEdges">
  <rect width="400" height="400" fill="#060812"/>
  <!-- the register: a lattice of cells with bits flipping in them -->
  <g fill="#0a1024">
    <rect x="0" y="0" width="400" height="2"/><rect x="0" y="50" width="400" height="2"/><rect x="0" y="100" width="400" height="2"/><rect x="0" y="150" width="400" height="2"/><rect x="0" y="200" width="400" height="2"/><rect x="0" y="250" width="400" height="2"/><rect x="0" y="300" width="400" height="2"/><rect x="0" y="350" width="400" height="2"/>
    <rect x="0" y="0" width="2" height="400"/><rect x="50" y="0" width="2" height="400"/><rect x="100" y="0" width="2" height="400"/><rect x="150" y="0" width="2" height="400"/><rect x="200" y="0" width="2" height="400"/><rect x="250" y="0" width="2" height="400"/><rect x="300" y="0" width="2" height="400"/><rect x="350" y="0" width="2" height="400"/>
  </g>
  <g opacity="0.6">
    <rect x="22" y="22" width="10" height="10" fill="#4a3aa8"/><rect x="122" y="22" width="10" height="10" fill="#2fa0a0"/><rect x="272" y="22" width="10" height="10" fill="#b23f9a"/><rect x="372" y="72" width="10" height="10" fill="#2f6fbf"/>
    <rect x="72" y="122" width="10" height="10" fill="#7a3fbf"/><rect x="322" y="122" width="10" height="10" fill="#2b2f7a"/><rect x="22" y="222" width="10" height="10" fill="#2fa0a0"/><rect x="372" y="272" width="10" height="10" fill="#4a3aa8"/>
    <rect x="72" y="322" width="10" height="10" fill="#b23f9a"/><rect x="222" y="372" width="10" height="10" fill="#2f6fbf"/><rect x="322" y="322" width="10" height="10" fill="#7a3fbf"/><rect x="22" y="372" width="10" height="10" fill="#2b2f7a"/>
  </g>
  <!-- gold plate lines of the machine -->
  <rect x="0" y="100" width="400" height="2" fill="#c9a24a" opacity="0.35"/>
  <rect x="0" y="300" width="400" height="2" fill="#c9a24a" opacity="0.35"/>
  <!-- the window: the operator's ring, with the chip inside -->
  <circle cx="200" cy="200" r="118" fill="#060812"/>
  <circle cx="200" cy="200" r="118" fill="none" stroke="#7fdfff" stroke-width="3" stroke-dasharray="6 10" opacity="0.9"/>
  <g fill="#5f70a4" opacity="0.8">
    <rect x="150" y="196" width="100" height="8"/><rect x="196" y="150" width="8" height="100"/>
    <rect x="110" y="140" width="40" height="4"/><rect x="250" y="256" width="40" height="4"/>
  </g>
  <g fill="#aab7dd"><rect x="194" y="194" width="12" height="12"/><rect x="196" y="252" width="8" height="8"/></g>
  <!-- candidates: a loud right answer in gold, wrong ones in violet -->
  <g>
    <rect x="236" y="128" width="26" height="26" fill="none" stroke="#ffcc55" stroke-width="4"/><rect x="242" y="134" width="8" height="8" fill="#ffcc55"/><rect x="252" y="144" width="4" height="4" fill="#ffcc55"/>
    <rect x="128" y="236" width="26" height="26" fill="none" stroke="#7a6cff" stroke-width="4"/><rect x="134" y="242" width="8" height="8" fill="#7a6cff"/><rect x="144" y="252" width="4" height="4" fill="#7a6cff"/>
    <rect x="258" y="248" width="20" height="20" fill="none" stroke="#7a6cff" stroke-width="3" opacity="0.6"/>
    <rect x="132" y="138" width="20" height="20" fill="none" stroke="#ffcc55" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- a bolt leaving the orb -->
  <rect x="222" y="178" width="4" height="4" fill="#7fdfff"/><rect x="228" y="172" width="4" height="4" fill="#7fdfff"/><rect x="234" y="166" width="4" height="4" fill="#e8fbff"/>
  <!-- Grover: the superposition orb and its six qubits -->
  <g fill="#7fdfff">
    <rect x="196" y="160" width="8" height="8"/><rect x="230" y="180" width="8" height="8"/><rect x="230" y="220" width="8" height="8"/>
    <rect x="196" y="240" width="8" height="8"/><rect x="162" y="220" width="8" height="8"/><rect x="162" y="180" width="8" height="8"/>
  </g>
  <rect x="190" y="190" width="20" height="20" fill="#7fdfff"/><rect x="194" y="194" width="12" height="12" fill="#e8fbff"/><rect x="198" y="198" width="4" height="4" fill="#ffffff"/>
</svg>
